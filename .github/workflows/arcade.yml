name: Generate Pac-Man contribution graph

on:
  schedule:
    # Tiap hari 22:43 UTC = 06:43 WITA (sebelum kartu ASCII di 07:17 WITA)
    - cron: "43 22 * * *"
  workflow_dispatch: # tombol "Run workflow" manual di tab Actions

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Push SVG to the pacman-output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
